stages:

  stat:
    cmd: python src/stat.py
    deps:
      - src/stat.py
    always_changed: true

  prepare:
    cmd: python src/split_rename.py
    deps:
      - src/split_rename.py
      - ${master_dir}
    params:
      - master_dir
      - output_dir
      - classes
      - prefixes
      - splits
      - bg_ratio
      - object_banks
    outs:
      - ${output_dir}

  train:
    cmd: python yolov8.py
    params:
      - train.name
      - train.epochs
      - train.batch_size
    deps:
      # - yolov8.py
      - ${output_dir}/images
    outs:
      - runs/train/${train.name}/weights/best.pt

plots:
  - precision_curve:
      title: "Precision"
      x: epoch
      y:
        runs/train/${train.name}/results.csv: metrics/precision(B)

  - recall_curve:
      title: "Recall"
      x: epoch
      y:
        runs/train/${train.name}/results.csv: metrics/recall(B)

  - pr_curve:
      title: "PR-curve"
      x:
        runs/train/${train.name}/results.csv: metrics/recall(B)
      y:
        runs/train/${train.name}/results.csv: metrics/precision(B)