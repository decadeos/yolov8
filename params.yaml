master_dir: "./datasets/ml-server"
output_dir: "./datasets/dataset-ball"

classes: "['airplane', 'small', 'red']"

prefixes:
  airplane: "airplane_"
  background: "bg_"
  small: "small_"
  red_balls: "red_"

splits:
  train: 0.7
  valid: 0.2
  test: 0.1

bg_ratio: 1

bg_bank:
  - background

object_banks:
  - airplane
  - small
  - red_balls

train:
  name: v11
  epochs: 5000
  batch_size: 16